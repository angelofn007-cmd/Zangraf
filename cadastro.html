<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Álbum Formatura</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            ÁLBUM FORMATURA
        </div>

        <nav class="nav">
            <a href="index.html">Início</a>
            <a href="galeria.html">Galeria</a>
            <a href="produtos.html">Álbuns</a>
        </nav>

    </header>


    <main class="login-page">

        <div class="login-container">

            <div class="login-header">

                <span>ÁLBUM FORMATURA</span>

                <h1>Crie sua conta.</h1>

                <p>
                    Cadastre-se para acompanhar seus pedidos
                    e acessar seus álbuns.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="button-primary login-button"
                >
                    Criar conta
                </button>

            </form>


            <div class="login-footer">

                <p>
                    Já possui uma conta?
                </p>

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
