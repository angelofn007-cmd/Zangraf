<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | Álbum de Formatura</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- CABEÇALHO -->

    <header class="header">

        <div class="logo">

            <span>ÁLBUM</span>

            <strong>FORMATURA</strong>

        </div>


        <nav class="menu">

            <a href="index.html">
                Início
            </a>

            <a href="galeria.html">
                Galeria
            </a>

            <a href="produtos.html">
                Álbuns
            </a>

        </nav>


        <a href="login.html" class="login-button">
            Entrar
        </a>

    </header>



    <!-- TÍTULO -->

    <section class="cart-header">

        <p class="section-label">
            SEU PEDIDO
        </p>

        <h1>
            Carrinho
        </h1>

    </section>



    <!-- CARRINHO -->

    <main class="cart-container">


        <!-- PRODUTOS DO CARRINHO -->

        <section class="cart-products">

            <div id="cartItems">

                <!-- Os produtos serão inseridos pelo JavaScript -->

            </div>


            <a
                href="produtos.html"
                class="continue-shopping"
            >
                ← Continuar comprando
            </a>

        </section>



        <!-- RESUMO -->

        <aside class="cart-summary">

            <h2>
                Resumo
            </h2>


            <div class="summary-line">

                <span>
                    Subtotal
                </span>

                <strong id="cartSubtotal">
                    R$ 0,00
                </strong>

            </div>


            <div class="summary-line">

                <span>
                    Total
                </span>

                <strong id="cartTotal">
                    R$ 0,00
                </strong>

            </div>


            <button
                class="checkout-button"
                id="checkoutButton"
            >
                Continuar para pagamento
            </button>


            <p class="secure-payment">
                🔒 Pagamento seguro
            </p>

        </aside>

    </main>



    <!-- RODAPÉ -->

    <footer class="footer">

        <div class="logo">

            <span>ÁLBUM</span>

            <strong>FORMATURA</strong>

        </div>


        <p>
            © 2026 Álbum de Formatura.
            Todos os direitos reservados.
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
