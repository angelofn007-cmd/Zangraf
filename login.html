<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Álbum Formatura</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            ÁLBUM FORMATURA
        </div>

        <nav class="nav">
            <a href="index.html">Início</a>
            <a href="galeria.html">Galeria</a>
            <a href="produtos.html">Álbuns</a>
        </nav>

    </header>


    <main class="login-page">

        <div class="login-container">

            <div class="login-header">

                <span>ÁLBUM FORMATURA</span>

                <h1>Bem-vindo de volta.</h1>

                <p>
                    Entre na sua conta para acessar suas compras.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="button-primary login-button"
                >
                    Entrar
                </button>

            </form>


            <div class="login-footer">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="cadastro.html">
                    Criar uma conta
                </a>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
