<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editor do Álbum | Álbum Formatura</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header class="editor-header">

        <div class="logo">
            ÁLBUM FORMATURA
        </div>

        <div class="editor-actions">

            <button
                class="editor-save"
                id="saveAlbum"
            >
                Salvar
            </button>

            <button
                class="editor-finish"
                id="finishAlbum"
            >
                Finalizar álbum
            </button>

        </div>

    </header>


    <main class="album-editor">


        <!-- LATERAL DE LÂMINAS -->

        <aside class="pages-sidebar">

            <div class="sidebar-title">

                <h2>
                    Lâminas
                </h2>

                <button
                    id="addPage"
                    class="add-page"
                >
                    +
                </button>

            </div>


            <div
                id="pagesList"
                class="pages-list"
            >

                <div
                    class="page-thumbnail active"
                    data-page="1"
                >

                    <span>01</span>

                    <div class="thumbnail-preview"></div>

                </div>


                <div
                    class="page-thumbnail"
                    data-page="2"
                >

                    <span>02</span>

                    <div class="thumbnail-preview"></div>

                </div>


                <div
                    class="page-thumbnail"
                    data-page="3"
                >

                    <span>03</span>

                    <div class="thumbnail-preview"></div>

                </div>

            </div>

        </aside>


        <!-- ÁREA DO EDITOR -->

        <section class="editor-workspace">


            <!-- FORMATO -->

            <div class="editor-options">

                <div class="option-section">

                    <h3>
                        Formato do álbum
                    </h3>

                    <div class="format-options">

                        <button
                            class="format-option active"
                            data-format="20x20"
                        >
                            20 × 20
                        </button>

                        <button
                            class="format-option"
                            data-format="25x25"
                        >
                            25 × 25
                        </button>

                        <button
                            class="format-option"
                            data-format="30x30"
                        >
                            30 × 30
                        </button>

                        <button
                            class="format-option"
                            data-format="20x30"
                        >
                            20 × 30
                        </button>

                        <button
                            class="format-option"
                            data-format="30x20"
                        >
                            30 × 20
                        </button>

                    </div>

                </div>


                <!-- MODELOS -->

                <div class="option-section">

                    <h3>
                        Modelo da lâmina
                    </h3>

                    <div class="layout-options">

                        <button
                            class="layout-option active"
                            data-layout="1"
                        >
                            <span class="layout-preview layout-1">
                                <i></i>
                            </span>

                            <strong>
                                1 foto
                            </strong>

                        </button>


                        <button
                            class="layout-option"
                            data-layout="2"
                        >
                            <span class="layout-preview layout-2">
                                <i></i>
                                <i></i>
                            </span>

                            <strong>
                                2 fotos
                            </strong>

                        </button>


                        <button
                            class="layout-option"
                            data-layout="3"
                        >
                            <span class="layout-preview layout-3">
                                <i></i>
                                <i></i>
                                <i></i>
                            </span>

                            <strong>
                                3 fotos
                            </strong>

                        </button>


                        <button
                            class="layout-option"
                            data-layout="4"
                        >
                            <span class="layout-preview layout-4">
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                            </span>

                            <strong>
                                4 fotos
                            </strong>

                        </button>


                        <button
                            class="layout-option"
                            data-layout="6"
                        >
                            <span class="layout-preview layout-6">
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                            </span>

                            <strong>
                                6 fotos
                            </strong>

                        </button>


                        <button
                            class="layout-option"
                            data-layout="9"
                        >
                            <span class="layout-preview layout-9">
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>
                            </span>

                            <strong>
                                9 fotos
                            </strong>

                        </button>

                    </div>

                </div>

            </div>


            <!-- PÁGINA -->

            <div class="workspace-top">

                <span id="currentPage">
                    Lâmina 01
                </span>

            </div>


            <div class="album-page">

                <div
                    class="album-content"
                    id="albumContent"
                >

                    <div class="album-placeholder">

                        <span>
                            SUA FOTO
                        </span>

                        <p>
                            Selecione um modelo
                        </p>

                    </div>


                    <div class="album-title">

                        Formandos 2026

                    </div>

                </div>

            </div>


            <!-- FERRAMENTAS -->

            <div class="editor-tools">

                <button id="addPhoto">
                    📷 Adicionar foto
                </button>

                <button id="addText">
                    📝 Adicionar texto
                </button>

                <button id="deleteElement">
                    🗑️ Remover
                </button>

                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                    hidden
                >

            </div>


        </section>


    </main>


 <script src="editor.js"></script>

</body>

</html>
